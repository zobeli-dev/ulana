[package]
name = "ulana"
description = "Luau scripts that draw native UI: a sandboxed runtime and a checked block tree."
readme = "README.md"
# tests/schema.rs compares spec/frame.schema.json, which lives outside the crate.
exclude = ["tests/schema.rs"]
keywords = ["luau", "ui", "sandbox", "generative-ui", "server-driven-ui"]
categories = ["gui", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
