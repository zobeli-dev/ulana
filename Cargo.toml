[workspace]
resolver = "2"
members = ["crates/ulana", "crates/ulana-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zobeli-dev/ulana"
rust-version = "1.85"

[workspace.dependencies]
mlua = { version = "0.12", features = ["luau", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
